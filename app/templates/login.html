<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Guidance & Counseling Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

            <body class="auth-body">

                <div class="auth-container">

                    <section class="auth-brand">

                <div class="brand-heading">
                    <div class="brand-logo">GC</div>

                    <div class="brand-heading-text">
                        <h1>University Guidance</h1>
                        <h1 class="second-line">and Counseling</h1>
                    </div>
                </div>

                <p class="brand-description">
                    A secure platform for counseling appointments, peer referrals,
                    case management, exit assessments, and student clearance.
                </p>

            </section>


        <section class="auth-card">

            <div class="auth-card-header">
                <h2>Welcome Back</h2>

                <p>
                    Sign in using your university account.
                </p>
            </div>


            <div
                id="loginMessage"
                class="message hidden"
                aria-live="polite"
            ></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary btn-full"
                >
                    Sign In
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    New student?
                </p>

                <a
                    href="/register"
                    class="link-button register-link"
                >
                    Create Student Account
                </a>

            </div>


            <div class="anonymous-section">

                <p>
                    Concerned about another student?
                </p>

                <button
                    type="button"
                    id="anonymousReferralButton"
                    class="btn btn-outline btn-full"
                >
                    Submit Anonymous Peer Referral
                </button>

            </div>

        </section>

    </div>


    <script
        src="{{ url_for('static', filename='js/api.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/auth.js') }}"
    ></script>

</body>

</html>
